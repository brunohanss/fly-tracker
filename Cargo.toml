[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/vision",
    "crates/tracking",
    "crates/aiming",
    "crates/camera",
    "crates/hardware",
    "crates/telemetry",
    "crates/app",
]

[workspace.package]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
nalgebra = "0.34"